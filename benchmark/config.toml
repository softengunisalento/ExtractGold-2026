# Configurazione del benchmark delle strategie di gestione del contesto (prima versione).
# Lo STESSO file va usato sulla macchina di misura e sul PC di controllo: il runner controlla l'impronta.
# I percorsi sono relativi alla cartella di questo file.

[esecuzione]
nome = "v1"                      # cartella dei risultati: <cartella_risultati>/<nome>; un nome nuovo per ogni esecuzione
seed = 42                        # ordine delle strategie (per conversazione) e ordine a giri delle conversazioni
cartella_risultati = "risultati"
# Ordine a giri: le conversazioni si dividono in fasce di turni (qui il turno minimo di ogni fascia: 10–11,
# 12–14, 15–19, 20–29, ≥30); ogni fascia si mescola con il seed e ogni giro prende una conversazione per fascia,
# dalla più corta alla più lunga. --max-conversazioni N = le prime N conversazioni di questa sequenza.
fasce_turni = [10, 12, 15, 20, 30]

[input]                          # file congelati
conversazioni = "../replay_set/conversazioni.jsonl"
selezione = "../replay_set/selezione.json"
modelli = "../selezioni/candidati_2026-10-19.json"
sha256_conversazioni = "44b790a91ac4fc903da8282fafd444d13835ec3a8a707f16df3bacde386a276d"

[rete]
host = "0.0.0.0"                 # dove ascolta il servizio di misura (su M1)
porta = 9100
indirizzo_misura = "http://127.0.0.1:9100"   # indirizzo di M1 visto dal PC di controllo: da cambiare
chiave = ""                      # facoltativa: se impostata, ogni richiesta al servizio deve portarla

[llama]
sorgenti = "../llama.cpp"
repository = "https://github.com/ggml-org/llama.cpp"
commit = "def4d406ae2c2f39573120d68730fbb7760b24bf"   # b11316-9-gdef4d406a
opzioni_cmake = ["-DGGML_CUDA=ON"]
eseguibile = "../llama.cpp/build/bin/llama-server"
porta = 8080                     # solo locale su M1
contesto = 32768
argomenti = ["-ngl", "99", "-np", "1", "--jinja"]   # --jinja: chat template del GGUF e parametri del template
cache_prompt = true
attesa_caricamento_s = 1800
cartella_modelli = "../models"

[generazione]
temperatura = 0.7
seed = 42
# nessun tetto alla lunghezza delle risposte (max_tokens non impostato)

[misura]
modalita = "machine"             # CodeCarbon: intera macchina, GPU + CPU + RAM
metodo_finestre = "auto"         # auto | task | tracker (auto: task se CodeCarbon li supporta)
riposo_secondi = 120             # consumo a riposo, con il modello caricato e dopo il riscaldamento
riscaldamento_richieste = 3
riscaldamento_messaggio = "Hello! Please introduce yourself in two sentences."

[strategie]
elenco = ["S0", "S1", "S2", "S3", "S4", "S5", "S6", "S7"]
soglia_token = 3500              # trigger: contesto di S0 contato con il tokenizer del modello in prova
turni_recenti = 3                # S1, S4, S7
s3_ogni_turni = 3
s7_recuperati = 2
quota_token_tenuti = 0.5         # S5 e S6: si tiene il 50% dei token (solo testo, codice intatto)
prefisso_riassunto = "Here is a summary of the conversation to date:"
prompt_ge = "Generate a prompt that contains a summary of the context and of the conversation, which will allow me to start a new conversation and continue solving my problem."
prompt_s3_primo = "Generate a summary of the context and of the conversation above, which will allow me to continue this conversation and keep solving my problem."
prompt_s3_aggiornamento = "Below are the current summary of the context and of the conversation, followed by the new messages. Update the summary so that it includes the new messages and still allows me to continue this conversation and keep solving my problem."
# Come si compone la richiesta di aggiornamento di S3: il prompt dice "Below", quindi riassunto e nuovi messaggi
# seguono il prompt nello stesso messaggio dell'utente. {prompt}, {riassunto} e {messaggi} sono obbligatori.
formato_s3_aggiornamento = "{prompt}\n\nCurrent summary:\n{riassunto}\n\nNew messages:\n{messaggi}"
prompt_s4 = "Generate a summary of the context and of the earlier part of the conversation above. The most recent messages will follow your summary word for word, so the summary must allow me to continue this conversation from them and keep solving my problem."

[ausiliari]                      # intercambiabili
llmlingua2 = "microsoft/llmlingua-2-xlm-roberta-large-meetingbank"
selective_context_modello = "gpt2"
selective_context_lingua = "en"
selective_context_unita = "phrase"
embedding = "BAAI/bge-small-en-v1.5"
embedding_max_token = 512
embedding_prefisso_query = "Represent this sentence for searching relevant passages: "
dispositivo = "cuda"
offline = true                   # durante l'esecuzione nessun download (funziona anche con lo switch)

[preparazione]
script_download = "../download_models.py"
requisiti = "requirements_misura.txt"
spacy_modello = "en_core_web_sm"

[giudice]                        # giudice LLM: gira su M1 dopo il benchmark, con la misura spenta
nome = "gpt-oss-120b"            # nome della cartella del modello in llama.cartella_modelli
repository = "ggml-org/gpt-oss-120b-GGUF"
file = "gpt-oss-120b-MXFP4.gguf"
commit = "238abdd290bb874b90a5da1b4549881b7d05c091"
contesto = 65536                 # storia (fino a ~32k) + messaggio + due risposte + istruzioni
argomenti = ["-ngl", "99", "-np", "1", "--jinja"]
chat_template_kwargs = { reasoning_effort = "low" }
temperatura = 1.0                # raccomandazione ufficiale di gpt-oss
top_p = 1.0
top_k = 0                        # 0 = disattivato (il default di llama-server è 40)
min_p = 0.0                      # 0 = disattivato (il default di llama-server è 0,05)
seed = 42                        # base del seed di ogni giudizio, ricavato dalle chiavi stabili
schema_json = true               # uscita vincolata dallo schema JSON in llama-server
tentativi_extra = 2              # uscita non valida: altri tentativi con seed diverso, poi "non valido"
campione_stabilita = 0.05        # indicatore 3: giudizi A e B ripetuti con un altro seed
campione_identita = 0.05         # indicatore 4: giudizi A con la risposta S0 al posto di quella della tecnica
campione_degrado = 0.05          # indicatore 5: giudizi A e B con la risposta S0 di un'altra conversazione
peso_relativi = 0.67             # punteggio = 0,67 x media dei relativi + 0,33 x media degli assoluti
peso_assoluti = 0.33
# Testi approvati. Segnaposto: {storia}, {messaggio}, {riferimento} (solo variante A), {risposta}.
prompt_relativo = '''You are an impartial evaluator. You will be given a conversation between a user and an AI assistant up to a certain point, the next message of the user, and two answers to that message: a reference answer and an answer to evaluate. Your task is to rate the answer to evaluate relative to the reference answer.

Criteria:
- Correctness: whether the content of the answer is right. Code must be valid and do what it claims; technical statements, explanations and steps must be accurate; the answer must actually solve or address what the user asked in the last message. Judge errors, bugs, false statements and wrong solutions, not style.
- Coherence with the context: whether the answer is consistent with the conversation so far. It must take into account what was already established (requirements, constraints, code, names, decisions, preferences of the user), must not contradict or forget it, must not ask again for information already given, and must fit the current point of the conversation.

For each criterion, give an integer from 1 to 10 comparing the answer to evaluate with the reference answer:
- 10: same content as the reference answer (wording may differ)
- 5: loses important parts of the reference answer
- 1: completely out of context or wrong
If the answer to evaluate is better than the reference answer, give 10.

Rules:
- Do not reward length: a longer answer is not better for being longer.
- Evaluate each answer exactly as given; do not assume what it would have contained.
- The conversation is quoted between the markers below; do not reply to it.

=== CONVERSATION START ===
{storia}
=== CONVERSATION END ===

=== USER MESSAGE START ===
{messaggio}
=== USER MESSAGE END ===

=== REFERENCE ANSWER START ===
{riferimento}
=== REFERENCE ANSWER END ===

=== ANSWER TO EVALUATE START ===
{risposta}
=== ANSWER TO EVALUATE END ===

Reply only with a JSON object with these fields, in this order: "motivation" (one or two sentences), "relative_correctness" (integer 1-10), "relative_coherence" (integer 1-10).'''
prompt_assoluto = '''You are an impartial evaluator. You will be given a conversation between a user and an AI assistant up to a certain point, the next message of the user, and an answer to that message. Your task is to rate the answer.

Criteria:
- Correctness: whether the content of the answer is right. Code must be valid and do what it claims; technical statements, explanations and steps must be accurate; the answer must actually solve or address what the user asked in the last message. Judge errors, bugs, false statements and wrong solutions, not style.
- Coherence with the context: whether the answer is consistent with the conversation so far. It must take into account what was already established (requirements, constraints, code, names, decisions, preferences of the user), must not contradict or forget it, must not ask again for information already given, and must fit the current point of the conversation.

For each criterion, give an integer from 1 to 10:
- 10: fully correct and coherent, with no relevant flaws
- 5: partly right, but with important errors or omissions
- 1: completely wrong or out of context

Rules:
- Do not reward length: a longer answer is not better for being longer.
- Evaluate each answer exactly as given; do not assume what it would have contained.
- The conversation is quoted between the markers below; do not reply to it.

=== CONVERSATION START ===
{storia}
=== CONVERSATION END ===

=== USER MESSAGE START ===
{messaggio}
=== USER MESSAGE END ===

=== ANSWER START ===
{risposta}
=== ANSWER END ===

Reply only with a JSON object with these fields, in this order: "motivation" (one or two sentences), "absolute_correctness" (integer 1-10), "absolute_coherence" (integer 1-10).'''
storia_vuota = "(empty)"

[giudice.soglie]                 # avvisi nel referto del giudice: da fissare dopo il pilota.
# Una soglia assente vale "da fissare": il valore si riporta senza avviso. Chiavi possibili:
# non_validi_max, quota_dieci_max, stabilita_differenza_media_max, identita_media_min,
# degrado_media_max, bias_lunghezza_max, coerenza_interna_min

[elaborazione]                   # sul PC di controllo (requirements_runner.txt)
bootstrap_ripetizioni = 2000     # intervalli di confidenza: bootstrap sulle conversazioni
livello_confidenza = 0.95
seed = 42
min_conversazioni_per_punto = 20 # grafici per distanza dal trigger: solo i punti con abbastanza conversazioni
